<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Vekta vs Vector Magic — Gum Tree</title>
<style>body{margin:0;font:12px system-ui;background:#101014;color:#eee}pre{padding:12px 16px;line-height:1.5}</style>
<pre id="out">calculando…</pre>
<script>
  const load = (url) => new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error("no cargó " + url));
    img.src = url;
  });

  const gray = (data) => {
    const out = new Float32Array(data.length / 4);
    for (let i = 0, p = 0; i < data.length; i += 4, p++) out[p] = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
    return out;
  };

  function ssim(a, b, w, h) {
    const C1 = (0.01*255)**2, C2 = (0.03*255)**2, B = 8;
    let total = 0, n = 0;
    for (let y = 0; y + B <= h; y += B) for (let x = 0; x + B <= w; x += B) {
      let sa = 0, sb = 0;
      for (let j = 0; j < B; j++) for (let i = 0; i < B; i++) { const p = (y+j)*w + (x+i); sa += a[p]; sb += b[p]; }
      const N = B*B, ma = sa/N, mb = sb/N;
      let va = 0, vb = 0, cov = 0;
      for (let j = 0; j < B; j++) for (let i = 0; i < B; i++) {
        const p = (y+j)*w + (x+i); const da = a[p]-ma, db = b[p]-mb; va += da*da; vb += db*db; cov += da*db;
      }
      va /= N; vb /= N; cov /= N;
      total += ((2*ma*mb + C1)*(2*cov + C2))/((ma*ma + mb*mb + C1)*(va + vb + C2)); n++;
    }
    return n ? total/n : 0;
  }

  function psnr(a, b, w, h) {
    let sum = 0;
    for (let p = 0; p < w*h; p++) { const d = a[p]-b[p]; sum += d*d; }
    const mse = sum/(w*h);
    return mse === 0 ? Infinity : 10*Math.log10((255*255)/mse);
  }

  async function raster(url, w, h) {
    const img = await load(url);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    return gray(ctx.getImageData(0, 0, w, h).data);
  }

  (async () => {
    const W = 1400, H = 775;
    const vm = await raster("/out/vectormagic-gumtree.png", W, H);
    const original = await raster("/inputs/" + encodeURIComponent("Gum Tree Vector.jpg"), W, H);
    const candidates = [
      ["vtracer default (exp 01)", "/out/svg/gum-tree-vector__default.svg"],
      ["vtracer cutout-opt (exp 01)", "/out/svg/gum-tree-vector__cutout-opt.svg"],
      ["cuantizado 16 + default", "/out/pipeline/gum-tree-vector__default__quantized.svg"],
      ["cuantizado 16 + cutout-opt", "/out/pipeline/gum-tree-vector__cutout-opt__quantized.svg"],
      ["calibrado 12 col / simplify 0,6", "/out/pipeline-sweep-pal/gum-tree-vector__c12__s0.6.svg"],
    ];
    const rows = [{ label: "Vector Magic (su render)", ssimVsVm: 1, ssimVsOriginal: +ssim(original, vm, W, H).toFixed(4), psnrVsOriginal: +psnr(original, vm, W, H).toFixed(2) }];
    for (const [label, url] of candidates) {
      const g = await raster(url, W, H);
      rows.push({
        label,
        ssimVsVm: +ssim(vm, g, W, H).toFixed(4),
        ssimVsOriginal: +ssim(original, g, W, H).toFixed(4),
        psnrVsOriginal: +psnr(original, g, W, H).toFixed(2),
      });
    }
    window.results = rows;
    document.getElementById("out").textContent = rows.map(r => `${r.label.padEnd(36)} SSIM ${r.ssim}  PSNR ${r.psnr}`).join("\n");
    window.ready = true;
  })().catch(e => { document.getElementById("out").textContent = "ERROR: " + e.message; window.ready = true; });
</script>
</html>
