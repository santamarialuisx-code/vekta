<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Métricas de fidelidad — vtracer</title>
    <style>
      body { font: 14px/1.5 ui-monospace, monospace; background: #111; color: #ddd; padding: 24px; }
      h1 { font-size: 16px; }
      #log { white-space: pre-wrap; }
      .ok { color: #6d6; }
      .bad { color: #d66; }
    </style>
  </head>
  <body>
    <h1>Calculando PSNR / SSIM…</h1>
    <div id="log"></div>
    <script type="module">
      const log = (s) => (document.getElementById("log").textContent += s + "\n");

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("load failed: " + src));
          img.src = src;
        });
      }

      function gray(data, w, h) {
        const g = new Float32Array(w * h);
        for (let i = 0, p = 0; i < data.length; i += 4, p++) {
          g[p] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        }
        return g;
      }

      function psnr(a, b) {
        let se = 0;
        for (let i = 0; i < a.length; i++) {
          const d = a[i] - b[i];
          se += d * d;
        }
        const mse = se / a.length;
        return mse === 0 ? 99 : 10 * Math.log10((255 * 255) / mse);
      }

      // SSIM global sobre ventanas 8x8 con stride 8 (aproximación estándar).
      function ssim(a, b, w, h) {
        const C1 = (0.01 * 255) ** 2;
        const C2 = (0.03 * 255) ** 2;
        const B = 8;
        let total = 0;
        let n = 0;
        for (let y = 0; y + B <= h; y += B) {
          for (let x = 0; x + B <= w; x += B) {
            let sa = 0, sb = 0;
            for (let j = 0; j < B; j++)
              for (let i = 0; i < B; i++) {
                const p = (y + j) * w + (x + i);
                sa += a[p];
                sb += b[p];
              }
            const N = B * B;
            const ma = sa / N, mb = sb / N;
            let va = 0, vb = 0, cov = 0;
            for (let j = 0; j < B; j++)
              for (let i = 0; i < B; i++) {
                const p = (y + j) * w + (x + i);
                const da = a[p] - ma, db = b[p] - mb;
                va += da * da;
                vb += db * db;
                cov += da * db;
              }
            va /= N; vb /= N; cov /= N;
            total += ((2 * ma * mb + C1) * (2 * cov + C2)) / ((ma * ma + mb * mb + C1) * (va + vb + C2));
            n++;
          }
        }
        return n ? total / n : 0;
      }

      const res = await fetch("out/metrics.json").then((r) => r.json());

      // cache de originales
      const originals = new Map();
      async function original(image) {
        if (!originals.has(image)) {
          const img = await loadImage("inputs/" + encodeURIComponent(image));
          const c = document.createElement("canvas");
          c.width = img.naturalWidth;
          c.height = img.naturalHeight;
          const ctx = c.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(img, 0, 0);
          originals.set(image, {
            w: c.width,
            h: c.height,
            gray: gray(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height),
          });
        }
        return originals.get(image);
      }

      const out = [];
      for (const row of res) {
        try {
          const o = await original(row.image);
          const img = await loadImage("out/" + row.svg);
          const c = document.createElement("canvas");
          c.width = o.w;
          c.height = o.h;
          const ctx = c.getContext("2d", { willReadFrequently: true });
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, o.w, o.h);
          ctx.drawImage(img, 0, 0, o.w, o.h);
          const g = gray(ctx.getImageData(0, 0, o.w, o.h).data, o.w, o.h);
          const p = psnr(o.gray, g);
          const s = ssim(o.gray, g, o.w, o.h);
          out.push({ ...row, psnr: +p.toFixed(2), ssim: +s.toFixed(4), w: o.w, h: o.h });
          log(`${row.imgSlug} ${row.variant}  SSIM=${s.toFixed(4)}  PSNR=${p.toFixed(2)}`);
        } catch (e) {
          log("FAIL " + row.imgSlug + " " + row.variant + " " + e.message);
        }
      }

      document.getElementById("log").textContent = "LISTO\n" + document.getElementById("log").textContent;
      window.__RESULTS__ = out;
      log("\nDONE " + out.length);
    </script>
  </body>
</html>
