# Integración continua del banco: cada push a main y cada pull request pasan las pruebas en las
# dos versiones de Node que nos importan (20, aún la mínima soportada, y 22, la siguiente LTS).
#
# Solo acciones oficiales (`actions/*`): el repo no tiene dependencias de terceros en el CI, así
# que no hay nada que inventar ni que auditar fuera de lo que mantiene GitHub. pnpm se activa con
# Corepack, que viene con Node, y la versión la fija `packageManager` en package.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Activar pnpm (Corepack, la versión de package.json)
        run: corepack enable pnpm

      - name: Caché del store de pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # `--frozen-lockfile` es el equivalente a `npm ci`: si pnpm-lock.yaml no cuadra con
      # package.json, falla en vez de resolver otras versiones.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Pruebas
        run: pnpm test

      # Humo del camino que se entrega (`bench/auto-trace.mjs`): cubre la carga del motor nativo,
      # la lectura de una imagen real y la escritura del informe. Se limita a K1, que el preset de
      # line art traza a 3×, así que tarda unos segundos en vez de menos de uno: cabe igual en las
      # dos versiones de la matriz.
      - name: Humo del trazado automático sobre K1
        run: node bench/auto-trace.mjs --only K1 --out /tmp/auto --json /tmp/auto.json
